name: Deploy Singapore development release

run-name: Deploy ${{ inputs.release_sha }} to Singapore development

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Verify workflow run ID that built the release artifacts
        required: true
        type: string
      release_sha:
        description: Exact 40-character main commit SHA produced by that run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: singapore-development-promotion
  cancel-in-progress: false

jobs:
  deploy-release:
    name: Validate and deploy approved release
    runs-on: ubuntu-latest
    environment:
      name: singapore-development
      url: https://uae-health.softdefine.com
    steps:
      - name: Validate promotion inputs
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify the selected workflow run
        uses: actions/github-script@v7
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const runId = Number(process.env.ARTIFACT_RUN_ID);
            const releaseSha = process.env.RELEASE_SHA;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const failures = [];
            if (run.head_repository?.full_name !== expectedRepository) {
              failures.push("repository");
            }
            if (run.path !== ".github/workflows/verify.yml") {
              failures.push("workflow");
            }
            if (run.event !== "workflow_dispatch") {
              failures.push("event");
            }
            if (run.head_branch !== "main") {
              failures.push("branch");
            }
            if (run.head_sha !== releaseSha) {
              failures.push("revision");
            }
            if (run.status !== "completed" || run.conclusion !== "success") {
              failures.push("result");
            }

            if (failures.length > 0) {
              core.setFailed(`Selected artifact run failed validation: ${failures.join(", ")}`);
            }

      - name: Check out current main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the release revision belongs to main
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD

      - name: Download the revision-pinned web artifact
        uses: actions/download-artifact@v4
        with:
          name: uae-health-web-${{ inputs.release_sha }}
          path: artifacts/web
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Download the revision-pinned API artifact
        uses: actions/download-artifact@v4
        with:
          name: uae-health-api-${{ inputs.release_sha }}
          path: artifacts/api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Verify artifact checksums and release metadata
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          web_expected="$(cut -d ' ' -f 1 "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz.sha256")"
          web_actual="$(sha256sum "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz" | cut -d ' ' -f 1)"
          api_expected="$(cut -d ' ' -f 1 "artifacts/api/uae-health-api-${RELEASE_SHA}.tar.sha256")"
          api_actual="$(sha256sum "artifacts/api/uae-health-api-${RELEASE_SHA}.tar" | cut -d ' ' -f 1)"
          test "$web_expected" = "$web_actual"
          test "$api_expected" = "$api_actual"
          tar -xOf "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz" ./release.json |
            jq --exit-status --arg release_sha "$RELEASE_SHA" '
              .environment == "singapore-development" and
              .releaseId == $release_sha
            '
          tar -tf "artifacts/api/uae-health-api-${RELEASE_SHA}.tar" >/dev/null

      - name: Create the deployment manifest
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          web_sha="$(sha256sum "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz" | cut -d ' ' -f 1)"
          api_sha="$(sha256sum "artifacts/api/uae-health-api-${RELEASE_SHA}.tar" | cut -d ' ' -f 1)"
          jq --null-input \
            --arg environment "singapore-development" \
            --arg releaseId "$RELEASE_SHA" \
            --arg artifactRunId "$ARTIFACT_RUN_ID" \
            --arg deploymentRunId "$GITHUB_RUN_ID" \
            --arg webArtifact "uae-health-web-${RELEASE_SHA}.tar.gz" \
            --arg webSha256 "$web_sha" \
            --arg apiArtifact "uae-health-api-${RELEASE_SHA}.tar" \
            --arg apiSha256 "$api_sha" \
            '{
              environment: $environment,
              releaseId: $releaseId,
              artifactRunId: $artifactRunId,
              deploymentRunId: $deploymentRunId,
              web: {artifact: $webArtifact, sha256: $webSha256},
              api: {artifact: $apiArtifact, sha256: $apiSha256}
            }' > deployment/release.json

      - name: Configure strict SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SINGAPORE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/singapore_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/singapore_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/singapore_deploy" >/dev/null

      - name: Stage and atomically activate the release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          APPROVAL_RUN_ID: ${{ github.run_id }}
          APPROVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          SINGAPORE_SSH_HOST: ${{ vars.SINGAPORE_SSH_HOST }}
          SINGAPORE_SSH_PORT: ${{ vars.SINGAPORE_SSH_PORT }}
          SINGAPORE_SSH_USER: ${{ vars.SINGAPORE_SSH_USER }}
          SSH_IDENTITY_FILE: ${{ runner.temp }}/singapore_deploy
          SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/.ssh-known-hosts
          WEB_ARTIFACT: ${{ github.workspace }}/artifacts/web/uae-health-web-${{ inputs.release_sha }}.tar.gz
          WEB_CHECKSUM: ${{ github.workspace }}/artifacts/web/uae-health-web-${{ inputs.release_sha }}.tar.gz.sha256
          API_ARTIFACT: ${{ github.workspace }}/artifacts/api/uae-health-api-${{ inputs.release_sha }}.tar
          API_CHECKSUM: ${{ github.workspace }}/artifacts/api/uae-health-api-${{ inputs.release_sha }}.tar.sha256
          RELEASE_MANIFEST: ${{ github.workspace }}/deployment/release.json
        run: |
          set -euo pipefail
          cp "$HOME/.ssh/singapore_deploy" "$SSH_IDENTITY_FILE"
          cp "$HOME/.ssh/known_hosts" "$SSH_KNOWN_HOSTS_FILE"
          chmod 600 "$SSH_IDENTITY_FILE" "$SSH_KNOWN_HOSTS_FILE"
          .github/scripts/deploy-singapore-release.sh

      - name: Record the successful deployment
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p promotion
          jq --null-input \
            --arg environment "singapore-development" \
            --arg releaseId "$RELEASE_SHA" \
            --arg artifactRunId "$ARTIFACT_RUN_ID" \
            --arg deploymentRunId "$GITHUB_RUN_ID" \
            '{
              environment: $environment,
              releaseId: $releaseId,
              artifactRunId: $artifactRunId,
              deploymentRunId: $deploymentRunId
            }' > promotion/release.json

      - name: Upload the successful deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: uae-health-singapore-promotion-${{ inputs.release_sha }}
          path: promotion/release.json
          if-no-files-found: error
          retention-days: 7
