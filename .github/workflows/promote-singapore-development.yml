name: Approve Singapore development release

run-name: Approve ${{ inputs.release_sha }} for Singapore development

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Verify workflow run ID that built the release artifacts
        required: true
        type: string
      release_sha:
        description: Exact 40-character main commit SHA produced by that run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: singapore-development-promotion
  cancel-in-progress: false

jobs:
  approve-release:
    name: Validate approved release artifacts
    runs-on: ubuntu-latest
    environment:
      name: singapore-development
      url: https://uae-health.softdefine.com
    steps:
      - name: Validate promotion inputs
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify the selected workflow run
        uses: actions/github-script@v7
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const runId = Number(process.env.ARTIFACT_RUN_ID);
            const releaseSha = process.env.RELEASE_SHA;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const failures = [];
            if (run.head_repository?.full_name !== expectedRepository) {
              failures.push("repository");
            }
            if (run.path !== ".github/workflows/verify.yml") {
              failures.push("workflow");
            }
            if (run.event !== "workflow_dispatch") {
              failures.push("event");
            }
            if (run.head_branch !== "main") {
              failures.push("branch");
            }
            if (run.head_sha !== releaseSha) {
              failures.push("revision");
            }
            if (run.status !== "completed" || run.conclusion !== "success") {
              failures.push("result");
            }

            if (failures.length > 0) {
              core.setFailed(`Selected artifact run failed validation: ${failures.join(", ")}`);
            }

      - name: Check out current main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the release revision belongs to main
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD

      - name: Download the revision-pinned web artifact
        uses: actions/download-artifact@v4
        with:
          name: uae-health-web-${{ inputs.release_sha }}
          path: artifacts/web
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Download the revision-pinned API artifact
        uses: actions/download-artifact@v4
        with:
          name: uae-health-api-${{ inputs.release_sha }}
          path: artifacts/api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Verify artifact checksums and release metadata
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          web_expected="$(cut -d ' ' -f 1 "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz.sha256")"
          web_actual="$(sha256sum "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz" | cut -d ' ' -f 1)"
          api_expected="$(cut -d ' ' -f 1 "artifacts/api/uae-health-api-${RELEASE_SHA}.tar.sha256")"
          api_actual="$(sha256sum "artifacts/api/uae-health-api-${RELEASE_SHA}.tar" | cut -d ' ' -f 1)"
          test "$web_expected" = "$web_actual"
          test "$api_expected" = "$api_actual"
          tar -xOf "artifacts/web/uae-health-web-${RELEASE_SHA}.tar.gz" ./release.json |
            jq --exit-status --arg release_sha "$RELEASE_SHA" '
              .environment == "singapore-development" and
              .releaseId == $release_sha
            '
          tar -tf "artifacts/api/uae-health-api-${RELEASE_SHA}.tar" >/dev/null

      - name: Record the approved promotion
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p promotion
          jq --null-input \
            --arg environment "singapore-development" \
            --arg releaseId "$RELEASE_SHA" \
            --arg artifactRunId "$ARTIFACT_RUN_ID" \
            --arg approvalRunId "$GITHUB_RUN_ID" \
            '{
              environment: $environment,
              releaseId: $releaseId,
              artifactRunId: $artifactRunId,
              approvalRunId: $approvalRunId
            }' > promotion/release.json

      - name: Upload the approved promotion receipt
        uses: actions/upload-artifact@v4
        with:
          name: uae-health-singapore-promotion-${{ inputs.release_sha }}
          path: promotion/release.json
          if-no-files-found: error
          retention-days: 7
