services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: uae_health
      POSTGRES_USER: uae_health
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uae_health -d uae_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      ENABLE_API_DOCS: "true"
      DATABASE_URL: postgresql://uae_health:local-development-only@postgres:5432/uae_health
      DATABASE_MAX_CONNECTIONS: 5
      DATABASE_SSL: "false"
      ALLOW_SYNTHETIC_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "npm run db:migrate && npm run db:seed && npm run start:dev"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./src:/app/src
      - ./test:/app/test

volumes:
  postgres_data:
